<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Quiz interactivo</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
<header class="site-header"><a class="logo" href="../index.html">PL Lab</a><nav aria-label="Navegación principal"><a href="../index.html">Inicio</a><a href="../ruta.html">Ruta</a><a href="../secciones/a1-formulacion.html">Secciones</a><a href="../ejercicios/index.html">Ejercicios</a><a href="../quices/index.html">Quices</a><a href="../tutor/tutor.html">Tutor</a></nav></header>
<main class="container">
  <a class="button secondary" href="index.html">← Volver a quices</a>
  <h1 id="quiz-title"></h1>
  <p id="quiz-description" class="muted"></p>
  <article class="card" id="quiz-card">
    <p id="progress" class="badge"></p>
    <h2 id="question"></h2>
    <div id="options"></div>
    <input id="numeric" type="number" style="display:none" placeholder="Respuesta numérica">
    <div>
      <button id="submit">Responder</button>
      <button id="next" style="display:none">Siguiente</button>
    </div>
    <p id="feedback" aria-live="polite"></p>
  </article>
</main>
<script src="quiz.js"></script>
</body>
</html>
