<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Programación Lineal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: system-ui, Arial, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      margin: 0;
      padding: 40px;
    }
    main {
      max-width: 900px;
      margin: auto;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }
    a {
      display: block;
      background: white;
      padding: 24px;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      text-decoration: none;
      color: #0f172a;
      box-shadow: 0 8px 20px rgba(15,23,42,.06);
    }
    a:hover {
      border-color: #1d4ed8;
    }
    h1 {
      color: #1d4ed8;
    }
  </style>
</head>
<body>
  <main>
    <h1>Programación Lineal — Plataforma Web</h1>
    <p>Selecciona el sitio que deseas abrir.</p>

    <section class="cards">
      <a href="./aprendizaje/">
        <h2>Sitio A</h2>
        <p>Aprendizaje de Programación Lineal.</p>
      </a>
    </section>
  </main>
</body>
</html>
